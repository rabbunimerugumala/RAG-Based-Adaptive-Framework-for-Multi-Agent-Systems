[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag"
version = "0.1.0"
description = "RAG-Based Adaptive Framework for Multi-Agent Systems - Standard RAG vs. a four-agent adaptive RAG (research prototype)"
authors = [{ name = "Rabbuni, RcubiX Technologies" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "qdrant-client>=1.10",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "fastembed>=0.4",
]

[project.optional-dependencies]
# Local NLI verifier (cross-encoder/nli-deberta-v3-xsmall). Install torch CPU wheels first, see README.
nli = ["torch>=2.2", "transformers>=4.41", "sentencepiece>=0.2", "protobuf>=4"]
# Only needed to prepare the TriviaQA sample (scripts/prepare_triviaqa.py).
datasets = ["datasets>=2.19"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires locally downloaded models / a running Ollama server (opt-in: set ARAG_RUN_REAL_MODEL_TESTS=1)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017", "B905"]
